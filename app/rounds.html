<style>
/* Layout: one narrow run sheet. Today's three blocks run top to bottom in the order they are done; drills take over the same column. English is set in a reading serif, the UI in a plain sans, numbers in mono. */
:root {
  --paper: #ECEFF3;
  --sheet: #F9FAFB;
  --ink: #17202B;
  --muted: #586374;
  --rule: #D2D8E0;
  --cobalt: #2944C4;
  --cobalt-soft: #DEE4FA;
  --ok: #1D7549;
  --ok-soft: #DCEFE4;
  --warn: #9A5A00;
  --bad: #B0261D;
  --bad-soft: #F8E0DD;
  --c-review: #2944C4;
  --c-listen: #13807A;
  --c-speak: #8A3F9E;
  --f-en: "Literata", Georgia, "Times New Roman", serif;
  --f-ui: "IBM Plex Sans JP", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #10141A;
    --sheet: #171C24;
    --ink: #DCE2EA;
    --muted: #8B96A6;
    --rule: #2A313C;
    --cobalt: #93A8FF;
    --cobalt-soft: #222B4A;
    --ok: #63C390;
    --ok-soft: #173327;
    --warn: #E2A54E;
    --bad: #F2837A;
    --bad-soft: #3A1E1C;
    --c-review: #93A8FF;
    --c-listen: #4FC2B9;
    --c-speak: #C98AD9;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #10141A;
  --sheet: #171C24;
  --ink: #DCE2EA;
  --muted: #8B96A6;
  --rule: #2A313C;
  --cobalt: #93A8FF;
  --cobalt-soft: #222B4A;
  --ok: #63C390;
  --ok-soft: #173327;
  --warn: #E2A54E;
  --bad: #F2837A;
  --bad-soft: #3A1E1C;
  --c-review: #93A8FF;
  --c-listen: #4FC2B9;
  --c-speak: #C98AD9;
}

* { box-sizing: border-box; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-ui);
  font-size: 15px;
  line-height: 1.65;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 64px;
}
.wrap { max-width: 46rem; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
main { display: flex; flex-direction: column; gap: 28px; }
[hidden] { display: none !important; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--cobalt); outline-offset: 2px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.en { font-family: var(--f-en); }
.muted { color: var(--muted); }
.label { font-size: 12px; letter-spacing: .06em; color: var(--muted); font-weight: 500; }

/* header */
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--rule); padding-bottom: 12px; }
.mark { font-family: var(--f-en); font-style: italic; font-size: 22px; letter-spacing: -.01em; }
.mark b { font-style: normal; font-weight: 600; }
nav { display: flex; gap: 4px; }
nav button { background: none; border: 0; padding: 6px 10px; border-radius: var(--r); cursor: pointer; color: var(--muted); }
nav button[aria-current="page"] { color: var(--ink); background: var(--sheet); box-shadow: inset 0 0 0 1px var(--rule); }
.status { font-size: 12px; color: var(--muted); }
.status.warn { color: var(--warn); }

/* today */
.hero { display: flex; flex-direction: column; gap: 14px; }
.hero-line { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.big { font-family: var(--f-num); font-size: clamp(40px, 9vw, 64px); line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.big small { font-size: .38em; color: var(--muted); letter-spacing: 0; }
.bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--rule); }
.bar span { display: block; height: 100%; }
.bar .min { position: relative; }
.plan { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; }
.plan input { flex: 1 1 14rem; min-width: 0; background: transparent; border: 0; border-bottom: 1px dashed var(--rule); padding: 2px 0; }
.plan input:focus { border-bottom-color: var(--cobalt); outline: none; }

.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); }
.runs { display: flex; flex-direction: column; }
.run { display: grid; grid-template-columns: 2.2rem 1fr auto; gap: 4px 14px; align-items: center; padding: 16px 18px; border-top: 1px solid var(--rule); }
.run:first-child { border-top: 0; }
.run .idx { font-family: var(--f-num); font-size: 13px; color: var(--muted); align-self: start; padding-top: 2px; }
.run h3 { margin: 0; font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.run p { margin: 0; grid-column: 2; font-size: 13.5px; color: var(--muted); }
.run .go { grid-row: 1 / span 2; grid-column: 3; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.pill { font-size: 11.5px; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--rule); color: var(--muted); font-weight: 500; white-space: nowrap; }
.pill.done { color: var(--ok); border-color: currentColor; background: var(--ok-soft); }
.pill.part { color: var(--warn); border-color: currentColor; }
.pill.focus { color: var(--cobalt); border-color: currentColor; background: var(--cobalt-soft); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: var(--r); border: 1px solid var(--rule); background: var(--sheet); cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--cobalt); border-color: var(--cobalt); color: var(--sheet); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); padding-inline: 8px; }
.btn.ghost:hover { color: var(--ink); }
.btn:disabled { opacity: .45; cursor: default; }
.btn svg { width: 16px; height: 16px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }

/* habit grid */
.habit { display: flex; flex-direction: column; gap: 10px; }
.grid66 { display: grid; grid-template-columns: repeat(22, 1fr); gap: 4px; }
.grid66 i { aspect-ratio: 1; max-width: 100%; border-radius: 3px; background: var(--rule); display: block; }
.grid66 i.done { background: var(--ok); }
.grid66 i.part { background: color-mix(in srgb, var(--ok) 35%, var(--rule)); }
.grid66 i.miss { background: transparent; box-shadow: inset 0 0 0 1px var(--rule); }
.grid66 i.today { outline: 2px solid var(--ink); outline-offset: 1px; }
.grid66 i.future { background: transparent; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--rule) 60%, transparent); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

/* drill */
.drill { display: flex; flex-direction: column; gap: 18px; }
.drill-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.drill-head h2 { margin: 0; font-size: 18px; display: flex; align-items: center; gap: 10px; }
.card { padding: 22px; display: flex; flex-direction: column; gap: 16px; }
.prompt-en { font-family: var(--f-en); font-size: clamp(21px, 4.4vw, 27px); line-height: 1.4; text-wrap: balance; margin: 0; }
.prompt-ja { font-size: 19px; font-weight: 500; margin: 0; }
.wrong { text-decoration: underline wavy var(--bad); text-decoration-thickness: 1.5px; text-underline-offset: 5px; }
.answer-in { width: 100%; font-family: var(--f-en); font-size: 19px; line-height: 1.5; padding: 10px 12px; border: 1px solid var(--rule); border-radius: var(--r); background: var(--paper); resize: vertical; }
.answer-in:focus { outline: none; border-color: var(--cobalt); box-shadow: 0 0 0 3px var(--cobalt-soft); }
.diff { font-family: var(--f-en); font-size: 19px; line-height: 1.9; margin: 0; }
.diff .eq { }
.diff .miss { background: var(--bad-soft); color: var(--bad); border-radius: 3px; padding: 0 3px; }
.diff .extra { text-decoration: line-through; color: var(--muted); padding: 0 2px; }
.verdict { font-weight: 700; }
.verdict.ok { color: var(--ok); }
.verdict.ng { color: var(--bad); }
.note { font-size: 14px; color: var(--muted); border-left: 2px solid var(--rule); padding-left: 10px; margin: 0; }
.grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.grades button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 6px; border-radius: var(--r); border: 1px solid var(--rule); background: var(--sheet); cursor: pointer; }
.grades button .num { font-size: 12px; color: var(--muted); }
.grades button.suggest { border-color: var(--cobalt); box-shadow: 0 0 0 2px var(--cobalt-soft); }
.grades kbd { font-family: var(--f-num); font-size: 10.5px; color: var(--muted); }
.progress-dots { display: flex; gap: 3px; flex-wrap: wrap; }
.progress-dots i { width: 14px; height: 4px; border-radius: 2px; background: var(--rule); display: block; }
.progress-dots i.on { background: var(--ink); }
.chip { font-size: 11.5px; padding: 1px 7px; border-radius: 4px; background: var(--paper); border: 1px solid var(--rule); color: var(--muted); font-family: var(--f-num); }

/* speak */
.clock { font-family: var(--f-num); font-size: clamp(56px, 16vw, 96px); line-height: 1; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.rounds { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.rounds div { border: 1px solid var(--rule); border-radius: var(--r); padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; }
.rounds div.cur { border-color: var(--c-speak); box-shadow: 0 0 0 2px color-mix(in srgb, var(--c-speak) 25%, transparent); }
.rounds b { font-family: var(--f-num); font-weight: 500; font-size: 18px; }
.topics { display: flex; flex-direction: column; gap: 6px; }
.topics button { text-align: left; background: var(--paper); border: 1px solid var(--rule); border-radius: var(--r); padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.topics button:hover { border-color: var(--muted); }
.topics button[aria-pressed="true"] { border-color: var(--c-speak); background: color-mix(in srgb, var(--c-speak) 9%, var(--paper)); }
.topics .en { font-size: 16px; }
.topics small { color: var(--muted); font-size: 12.5px; }
.fb { display: flex; flex-direction: column; gap: 12px; }
.fb-item { border-top: 1px solid var(--rule); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.quote { font-family: var(--f-en); font-size: 18px; }
.quote mark { background: var(--bad-soft); color: var(--bad); padding: 0 3px; border-radius: 3px; }

/* lists & stats */
.list { display: flex; flex-direction: column; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 16px; border-top: 1px solid var(--rule); align-items: start; }
.item:first-child { border-top: 0; }
.item .en { font-size: 16px; }
.item .meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: 0; }
.stat { padding: 14px 18px; display: flex; flex-direction: column; gap: 2px; border-left: 1px solid var(--rule); }
.stat:first-child { border-left: 0; }
.stat b { font-family: var(--f-num); font-weight: 500; font-size: 26px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.chart { padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--muted); font-family: var(--f-num); font-size: 10px; }
.chart .grid { stroke: var(--rule); stroke-width: 1; }
form.add { display: grid; gap: 10px; padding: 18px; }
form.add label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
form.add input, form.add textarea, form.add select, .field { border: 1px solid var(--rule); border-radius: var(--r); background: var(--paper); padding: 8px 10px; }
.field { width: 100%; }
details summary { cursor: pointer; font-weight: 500; }
h2.sec { font-size: 15px; margin: 0; font-weight: 700; }
.section { display: flex; flex-direction: column; gap: 12px; }
.empty { padding: 22px; color: var(--muted); display: flex; flex-direction: column; gap: 10px; }
.empty p { margin: 0; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 9px 16px; border-radius: var(--r); font-size: 14px; z-index: 20; max-width: calc(100% - 32px); }
.thinking { color: var(--muted); font-style: italic; }
.grid66 i.kept { background: color-mix(in srgb, var(--ok) 45%, var(--rule)); }
.milestone { border: 1px solid var(--ok); background: var(--ok-soft); color: var(--ok); border-radius: var(--r); padding: 10px 14px; font-weight: 500; }
.callout { border: 1px dashed var(--cobalt); border-radius: var(--r); padding: 12px 16px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.chat { display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 88%; display: flex; flex-direction: column; gap: 4px; }
.msg.them { align-self: flex-start; }
.msg.me { align-self: flex-end; align-items: flex-end; }
.msg .bubble { font-family: var(--f-en); font-size: 18px; line-height: 1.5; padding: 10px 14px; border-radius: 10px; }
.msg.them .bubble { background: var(--paper); border: 1px solid var(--rule); }
.msg.me .bubble { background: color-mix(in srgb, var(--c-speak) 12%, var(--sheet)); border: 1px solid color-mix(in srgb, var(--c-speak) 35%, var(--rule)); }
.msg .bubble.veiled { color: transparent; text-shadow: 0 0 9px color-mix(in srgb, var(--ink) 55%, transparent); cursor: pointer; user-select: none; }
.msg small { font-size: 12px; color: var(--muted); }
.retry { border-left: 3px solid var(--warn); padding-left: 12px; display: flex; flex-direction: column; gap: 6px; }
@media (max-width: 520px) {
  .grades { grid-template-columns: repeat(2, 1fr); }
  .grid66 { grid-template-columns: repeat(11, 1fr); }
  .run { grid-template-columns: 1.6rem 1fr; }
  .run .go { grid-row: auto; grid-column: 2; justify-self: start; margin-top: 6px; }
  .stat { border-left: 0; border-top: 1px solid var(--rule); }
  .stat:first-child { border-top: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="mark"><b>English</b> Rounds</div>
    <nav id="nav">
      <button type="button" data-view="today" aria-current="page">今日</button>
      <button type="button" data-view="cards">カード</button>

    </div>
  </main>
</div>

<script>
"use strict";
/* ---------- tiny DOM helper ---------- */
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") el.setAttribute("style", v);
    else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
    else if (k === "value") el.value = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid instanceof Node ? kid : String(kid));
  }
  return el;
}

  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);

  for (const kid of kids.flat()) if (kid != null) el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));

}
const ICON = {
  play: () => svgEl("svg", { viewBox: "0 0 16 16", "aria-hidden": "true" }, svgEl("path", { d: "M4 2.5v11l9-5.5z", fill: "currentColor" })),
  slow: () => svgEl("svg", { viewBox: "0 0 16 16", "aria-hidden": "true" }, svgEl("path", { d: "M3 2.5v11l7-5.5zM11 3h2v10h-2z", fill: "currentColor" })),
};
const pad = (n) => String(n).padStart(2, "0");
const main = document.getElementById("main");
const statusEl = document.getElementById("status");
function toast(msg) {
  document.querySelector(".toast")?.remove();
  const t = h("div", { class: "toast", role: "status" }, msg);
  document.body.append(t);
  setTimeout(() => t.remove(), 2600);
}

/* ---------- dates (day starts at 04:00, like Anki) ---------- */
function dayKey(d = new Date()) {
  const x = new Date(d.getTime() - 4 * 3600e3);
  return `${x.getFullYear()}-${pad(x.getMonth() + 1)}-${pad(x.getDate())}`;
}
function addDays(key, n) {
  const [y, m, d] = key.split("-").map(Number);
  const x = new Date(y, m - 1, d + n, 12);
  return `${x.getFullYear()}-${pad(x.getMonth() + 1)}-${pad(x.getDate())}`;
}
function daysBetween(a, b) {
  const [y1, m1, d1] = a.split("-").map(Number), [y2, m2, d2] = b.split("-").map(Number);
  return Math.round((Date.UTC(y2, m2 - 1, d2) - Date.UTC(y1, m1 - 1, d1)) / 864e5);
}
const JP_DOW = ["日", "月", "火", "水", "木", "金", "土"];
function fmtDay(key) {
  const [y, m, d] = key.split("-").map(Number);
  return `${m}/${d} (${JP_DOW[new Date(y, m - 1, d).getDay()]})`;
}
function fmtIvl(ms) {
  const m = ms / 60000;
  if (m < 60) return `${Math.max(1, Math.round(m))}分`;
  const hr = m / 60;
  if (hr < 24) return `${Math.round(hr)}時間`;
  const d = hr / 24;
  if (d < 31) return `${Math.round(d)}日`;
  if (d < 365) return `${Math.round(d / 30)}か月`;
  return `${(d / 365).toFixed(1)}年`;
}

/* ---------- content that ships with the page ---------- */
const BLOCKS = {
  review: { name: "復習", min: 10, color: "var(--c-review)", desc: "前に間違えた表現と単語を、英語で自分で書いて答える。" },
  listen: { name: "聞く", min: 20, color: "var(--c-listen)", desc: "1 文ずつ聞いて書き取る。聞き落とした所は自動でカードになる。" },
  speak: { name: "話す", min: 15, color: "var(--c-speak)", desc: "同じお題を 4 分、3 分、2 分で 3 回話す。速さ (wpm) を記録する。" },
};
const KEEP_SEC = 5 * 60;    // keeps the streak (Duolingo: decoupling the streak from the daily goal raised retention)
const GOAL_SEC = 15 * 60;   // daily goal
const MIN_DAY_SEC = GOAL_SEC;
function dayLevel(d) {
  const sec = daySec(d);
  if (sec >= GOAL_SEC) return "done";
  if (sec >= KEEP_SEC || d?.review?.cleared) return "kept";

}
function dayWords(d) {

  return n;
}

const SCENARIOS = [
  { id: "standup", en: "Daily standup", ja: "朝会で、昨日やったこと・今日やること・困っていることを話す", role: "You are a friendly engineering manager running a remote daily standup with the user, a software engineer on your team. Ask what they did yesterday, what they plan today, and whether anything is blocking them, with natural follow-up questions." },

/* ---------- text comparison ---------- */
function keyOf(w) { return (w.replace(/[’‘']/g, "").toLowerCase().match(/[a-z0-9]+/g) || []).join(""); }
function wordsOf(s) { return s.trim().split(/\s+/).filter(Boolean).map((orig) => ({ orig, key: keyOf(orig) })).filter((w) => w.key); }
function align(answer, typed) {
  const a = wordsOf(answer), b = wordsOf(typed);
  const n = a.length, m = b.length;
  const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    dp[i][j] = a[i].key === b[j].key ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const ops = []; let i = 0, j = 0;
  while (i < n && j < m) {
    if (a[i].key === b[j].key) { ops.push({ t: "eq", w: a[i].orig, i }); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { ops.push({ t: "miss", w: a[i].orig, i }); i++; }
    else { ops.push({ t: "extra", w: b[j].orig }); j++; }
  }
  while (i < n) { ops.push({ t: "miss", w: a[i].orig, i }); i++; }
  while (j < m) { ops.push({ t: "extra", w: b[j].orig }); j++; }
  const miss = ops.filter((o) => o.t === "miss").length, extra = ops.filter((o) => o.t === "extra").length;
  return { ops, miss, extra, words: a };
}

  return h("p", { class: "diff" }, ops.map((o, k) => [k ? " " : "", h("span", { class: o.t }, o.w)]));
}
function bestAlign(answer, typed) {
  const alts = answer.split(/\s*\|\s*/).filter(Boolean);
  let best = null;
  for (const alt of alts) { const r = align(alt, typed); r.answer = alt; if (!best || r.miss + r.extra < best.miss + best.extra) best = r; }
  return best;
}

function minutesChart() {
  const W = 640, H = 170, L = 30, B = 22, T = 8;
  const keys = []; for (let i = 27; i >= 0; i--) keys.push(addDays(dayKey(), -i));
  const vals = keys.map((k) => { const d = Store.days.get(k); return { k, r: (d?.review?.sec || 0) / 60, l: (d?.listen?.sec || 0) / 60, s: (d?.speak?.sec || 0) / 60 }; });
  const maxV = Math.max(45, ...vals.map((v) => v.r + v.l + v.s));
  const top = Math.ceil(maxV / 15) * 15;
  const y = (v) => H - B - (v / top) * (H - B - T);
  const bw = (W - L) / keys.length;

  for (let g = 0; g <= top; g += 15) { svg.append(svgEl("line", { class: "grid", x1: L, x2: W, y1: y(g), y2: y(g) }), svgEl("text", { x: L - 6, y: y(g) + 3, "text-anchor": "end" }, g)); }
  svg.append(svgEl("line", { x1: L, x2: W, y1: y(15), y2: y(15), stroke: "var(--ok)", "stroke-dasharray": "3 3", "stroke-width": 1 }));
  vals.forEach((v, i) => {
    const x = L + i * bw + bw * 0.18, w = bw * 0.64;
    let acc = 0;
    for (const [key, col] of [["r", "var(--c-review)"], ["l", "var(--c-listen)"], ["s", "var(--c-speak)"]]) {
      if (v[key] > 0) { svg.append(svgEl("rect", { x, y: y(acc + v[key]), width: w, height: Math.max(0.5, y(acc) - y(acc + v[key])), fill: col })); acc += v[key]; }
    }
    if (i % 7 === 0 || i === vals.length - 1) svg.append(svgEl("text", { x: x + w / 2, y: H - 6, "text-anchor": "middle" }, v.k.slice(5).replace("-", "/")));
  });
  return h("div", { class: "sheet chart" },
    h("div", { class: "row between" }, h("h2", { class: "sec" }, "直近 28 日 (分)"),
      h("div", { class: "legend" }, ["review", "listen", "speak"].map((k) => h("span", {}, h("i", { style: `background:${BLOCKS[k].color}` }), BLOCKS[k].name)), h("span", {}, h("i", { style: "background:transparent;border-top:1px dashed var(--ok);height:0;border-radius:0" }), "15 分"))),
    h("div", { style: "overflow-x:auto" }, svg));
}
function wpmChart() {
  const pts = [];
  for (const d of [...Store.days.values()].sort((a, b) => (a.date < b.date ? -1 : 1)))
    for (const s of d.speak?.sessions || []) {
      const r1 = s.rounds?.[0], r3 = s.rounds?.[2];
      const w = (r) => (r && r.sec >= 20 && r.words ? r.words / (r.sec / 60) : null);
      if (w(r3) != null || w(r1) != null) pts.push({ date: d.date, w1: w(r1), w3: w(r3) });
    }
  const box = h("div", { class: "sheet chart" }, h("h2", { class: "sec" }, "話す速さ (wpm)"));
  if (pts.length < 2) {
    box.append(h("p", { class: "muted", style: "margin:0;font-size:13px" }, pts.length ? "あと 1 回 4/3/2 をやると、推移が線で出る。" : "4/3/2 を音声入力つきでやると、1 回目と 3 回目の wpm がここに並ぶ。"));
    return box;
  }
  const W = 640, H = 170, L = 34, B = 20, T = 10, R = 10;
  const vs = pts.flatMap((p) => [p.w1, p.w3]).filter((v) => v != null);
  const lo = Math.max(0, Math.floor((Math.min(...vs) - 10) / 20) * 20), hi = Math.ceil((Math.max(...vs) + 10) / 20) * 20;
  const x = (i) => L + (i / (pts.length - 1)) * (W - L - R);
  const y = (v) => H - B - ((v - lo) / (hi - lo)) * (H - B - T);
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "4/3/2 の wpm の推移" });
  for (let g = lo; g <= hi; g += 20) svg.append(svgEl("line", { class: "grid", x1: L, x2: W - R, y1: y(g), y2: y(g) }), svgEl("text", { x: L - 6, y: y(g) + 3, "text-anchor": "end" }, g));
  for (const [key, col, dash] of [["w1", "var(--muted)", "4 3"], ["w3", "var(--c-speak)", ""]]) {
    const seg = pts.map((p, i) => (p[key] != null ? `${x(i)},${y(p[key])}` : null)).filter(Boolean);
    if (seg.length > 1) svg.append(svgEl("polyline", { points: seg.join(" "), fill: "none", stroke: col, "stroke-width": 2, "stroke-dasharray": dash }));
    pts.forEach((p, i) => { if (p[key] != null) svg.append(svgEl("circle", { cx: x(i), cy: y(p[key]), r: i === pts.length - 1 ? 4 : 2.5, fill: col })); });
  }
  svg.append(svgEl("text", { x: L, y: H - 4 }, pts[0].date.slice(5).replace("-", "/")), svgEl("text", { x: W - R, y: H - 4, "text-anchor": "end" }, pts[pts.length - 1].date.slice(5).replace("-", "/")));
  box.append(h("div", { class: "legend" }, h("span", {}, h("i", { style: "background:var(--muted)" }), "1 回目 (4 分)"), h("span", {}, h("i", { style: "background:var(--c-speak)" }), "3 回目 (2 分)")), h("div", { style: "overflow-x:auto" }, svg));
  return box;
}
